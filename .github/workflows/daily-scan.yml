name: Daily EMA scan

on:
  schedule:
    # 22:00 UTC is after the US cash close in both EST and EDT. Weekdays only:
    # the signal uses that completed session and assumes entry at the next open.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Test Discord webhook
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl --fail --show-error --silent \
            --header "Content-Type: application/json" \
            --data '{"content":"**#1 BUY AXON | SCORE 0.637 | decision close 612.83 | entry next open | ADX 19.1 | TECH 4/4**\nTest from GitHub Actions — webhook is working."}' \
            "$DISCORD_WEBHOOK"

      - name: Trigger Render scan
        env:
          RENDER_RUN_URL: ${{ secrets.RENDER_RUN_URL }}
          RUN_TOKEN: ${{ secrets.RUN_TOKEN }}
        run: |
          if [ -z "$RENDER_RUN_URL" ] || [ -z "$RUN_TOKEN" ]; then
            echo "Skipping Render trigger — RENDER_RUN_URL or RUN_TOKEN not set"
            exit 0
          fi
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "X-Run-Token: $RUN_TOKEN" \
            "$RENDER_RUN_URL"
